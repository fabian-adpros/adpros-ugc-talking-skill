name: Release skill archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ugc-talking-head.zip and .skill
        run: ./scripts/package.sh

      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/ugc-talking-head.zip \
            dist/ugc-talking-head.skill \
            --clobber
