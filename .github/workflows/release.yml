name: Release skill archive

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build adpros-ugc-talking-skill.zip and .skill
        run: ./scripts/package.sh

      - name: Publish renamed archives without touching v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${RELEASE_TAG}"
          fi
          assets=""
          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          fi
          if printf '%s\n' "$assets" | grep -qx 'ugc-talking-head.zip'; then
            echo "Refusing to modify historical release $tag"
            exit 1
          fi
          if printf '%s\n' "$assets" | grep -qx 'adpros-ugc-talking-skill.zip' \
            && printf '%s\n' "$assets" | grep -qx 'adpros-ugc-talking-skill.skill'; then
            echo "Release $tag already has the renamed archives"
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Public skill id: adpros-ugc-talking-skill. Invoke /adpros-ugc-talking-skill. Archive root: adpros-ugc-talking-skill/SKILL.md. Release v0.1.0 stays historical."
          fi
          gh release upload "$tag" \
            dist/adpros-ugc-talking-skill.zip \
            dist/adpros-ugc-talking-skill.skill
