name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/adpros-ugc-talking-skill/template/package-lock.json

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          if ! timeout 90 sudo apt-get update || ! timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg libxml2-utils; then
            echo "Ubuntu archive is unreachable; installing ffmpeg 8.1 and xmllint from GitHub"
            mkdir -p "$HOME/.local/bin" /tmp/ffmpeg-extract /tmp/src
            curl -fsSL -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract
            install -m 755 "$(find /tmp/ffmpeg-extract -type f -name ffmpeg -print -quit)" "$HOME/.local/bin/ffmpeg"
            install -m 755 "$(find /tmp/ffmpeg-extract -type f -name ffprobe -print -quit)" "$HOME/.local/bin/ffprobe"
            git clone --depth 1 --branch v2.13.9 https://github.com/GNOME/libxml2.git /tmp/src/libxml2
            cmake -S /tmp/src/libxml2 -B /tmp/src/libxml2/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DLIBXML2_WITH_PYTHON=OFF \
              -DLIBXML2_WITH_TESTS=OFF
            cmake --build /tmp/src/libxml2/build --target xmllint -j"$(nproc)"
            install -m 755 /tmp/src/libxml2/build/xmllint "$HOME/.local/bin/xmllint"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v ffmpeg
          command -v xmllint
          ffmpeg -hide_banner -version
          xmllint --version

      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest numpy 'auto-editor>=29,<30' 'opentimelineio>=0.17,<0.19' otio-cmx3600-adapter otio-fcp-adapter otio-fcpx-xml-adapter
          python -m pytest tests

      - name: Package skill archive
        run: ./scripts/package.sh

      - name: Install Remotion template from the lockfile
        working-directory: skills/adpros-ugc-talking-skill/template
        run: npm ci
