name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/adpros-ugc-talking-skill/template/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg

      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest 'auto-editor>=29,<30' 'opentimelineio>=0.17,<0.18' otio-cmx3600-adapter otio-fcp-adapter otio-fcpx-xml-adapter
          python -m pytest tests

      - name: Package skill archive
        run: ./scripts/package.sh

      - name: Install Remotion template from the lockfile
        working-directory: skills/adpros-ugc-talking-skill/template
        run: npm ci
