name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/ugc-talking-head/template/package-lock.json

      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests

      - name: Package skill archive
        run: ./scripts/package.sh

      - name: Install Remotion template from the lockfile
        working-directory: skills/ugc-talking-head/template
        run: npm ci
