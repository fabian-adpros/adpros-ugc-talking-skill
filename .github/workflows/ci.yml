name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/adpros-ugc-talking-skill/template/package-lock.json

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg libxml2-utils; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying"
            sleep 10
          done
          exit 1

      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest numpy 'auto-editor>=29,<30' 'opentimelineio>=0.17,<0.19' otio-cmx3600-adapter otio-fcp-adapter otio-fcpx-xml-adapter
          python -m pytest tests

      - name: Package skill archive
        run: ./scripts/package.sh

      - name: Install Remotion template from the lockfile
        working-directory: skills/adpros-ugc-talking-skill/template
        run: npm ci
